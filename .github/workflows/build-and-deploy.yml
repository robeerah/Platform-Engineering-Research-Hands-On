name: Reusable Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: "Name of the application"
        required: true
        type: string
      config_file:
        description: "Path to the app's JSON config, relative to the repo root"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: false
        type: string
        default: "dev"
      nomad_version:
        description: "Nomad version used to validate the generated job"
        required: false
        type: string
        default: "2.1.1"
    secrets:
      NOMAD_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          APP_NAME: ${{ inputs.app_name }}
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          if ! [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::app_name must be lowercase letters, digits and dashes (got '$APP_NAME')"
            exit 1
          fi
          [ -f "$CONFIG_FILE" ] || { echo "::error::config file '$CONFIG_FILE' not found"; exit 1; }
          CONFIG_APP="$(jq -r '.app_name' "$CONFIG_FILE")"
          if [ "$CONFIG_APP" != "$APP_NAME" ]; then
            echo "::error::app_name input '$APP_NAME' does not match '$CONFIG_APP' in $CONFIG_FILE"
            exit 1
          fi
          echo " $APP_NAME ($CONFIG_FILE) is valid"

      - name: Lint platform scripts
        run: |
          mapfile -t SCRIPTS < <(git ls-files '*.sh')
          for f in "${SCRIPTS[@]}"; do bash -n "$f"; done
          shellcheck -x -S warning "${SCRIPTS[@]}"
          echo " ${#SCRIPTS[@]} scripts passed bash -n and shellcheck"

      - name: Install Nomad ${{ inputs.nomad_version }}
        env:
          NOMAD_VERSION: ${{ inputs.nomad_version }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nomad.zip" "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -q -o "$RUNNER_TEMP/nomad.zip" -d "$RUNNER_TEMP/nomad"
          echo "$RUNNER_TEMP/nomad" >> "$GITHUB_PATH"

      - name: Generate and validate Nomad job
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          OUTPUT_DIR: ${{ runner.temp }}/jobs
        run: |
          nomad version
          bash ./phase-1-nomad-consul/generate-hcl.sh "$CONFIG_FILE" --dry-run

      - name: Upload job spec
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-nomad-job
          path: ${{ runner.temp }}/jobs/${{ inputs.app_name }}.nomad.hcl
          if-no-files-found: error

  deploy:
    name: Deploy ${{ inputs.app_name }} to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download job spec
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_name }}-nomad-job

      - name: Deploy (dry run)
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          {
            echo "##  $APP_NAME → $TARGET_ENV"
            echo
            echo "The Nomad job spec was generated and validated in the build job."
            echo "GitHub-hosted runners cannot reach the lab's local Nomad cluster, so the deploy is a dry run."
            echo "Deploy locally with: \`./phase-5-golden-path/golden-path.sh <config>\`"
            echo
            echo '```hcl'
            sed -n '1,30p' "$APP_NAME.nomad.hcl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo " $APP_NAME ready for $TARGET_ENV"
